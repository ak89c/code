<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پیگیری اذکار</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#edf2f0;--card:#fff;--ink:#12302b;--mute:#5d7770;--acc:#1f7a6b;--acc2:#e6f3ef;--gold:#b8861f;--line:#d3dfdb;--warn:#fff4d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1a18;--card:#162623;--ink:#e3efec;--mute:#92aaa4;--acc:#4fbfa9;--acc2:#1d3733;--gold:#e0b24d;--line:#27403b;--warn:#3a3118}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1a18;--card:#162623;--ink:#e3efec;--mute:#92aaa4;--acc:#4fbfa9;--acc2:#1d3733;--gold:#e0b24d;--line:#27403b;--warn:#3a3118}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7}
main{max-width:560px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:22px;margin:6px 0 2px}
.sub{color:var(--mute);font-size:13px;margin:0 0 12px}
.banner{background:var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.card.done{border-color:var(--acc)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.code{font-size:22px;font-weight:800;direction:ltr;unicode-bidi:isolate;letter-spacing:1px;word-break:break-all}
.note{color:var(--mute);font-size:13.5px;margin:4px 0 8px;white-space:pre-wrap}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:13px;color:var(--mute);margin-bottom:8px}
.meta b{color:var(--ink);font-weight:600}
.bar{height:8px;background:var(--acc2);border-radius:99px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.zr{display:flex;align-items:center;gap:10px}
.tap{flex:1;min-height:64px;border:0;border-radius:14px;background:var(--acc);color:#fff;font:inherit;font-size:19px;font-weight:800;cursor:pointer;touch-action:manipulation;user-select:none}
.tap:active{transform:scale(.98)}
.tap[disabled]{background:var(--acc2);color:var(--acc)}
.small{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;font:inherit;font-size:13px;padding:6px 10px;cursor:pointer}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:6px;font-size:14px}
.chk input{width:22px;height:22px;accent-color:var(--acc)}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--gold);color:#fff;border:0;border-radius:99px;padding:14px 22px;font:inherit;font-weight:800;font-size:16px;box-shadow:0 4px 14px #0004;cursor:pointer}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);width:min(92vw,460px);padding:16px;font-family:inherit}
dialog::backdrop{background:#0008}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 2px}
input,textarea{width:100%;font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.set{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-bottom:12px}
.set input{width:auto}
</style>
</head>
<body>
<main>
  <h1>پیگیری اذکار</h1>
  <p class="sub" id="today"></p>
  <p class="sub" id="sync"></p>
  <div id="banner"></div>
  <div class="set">
    <span>یادآوری روزانه:</span><input type="time" id="rtime"><button class="small" id="rbtn">فعال‌سازی اعلان</button>
  </div>
  <div id="list"></div>
</main>
<button class="fab" id="add">+ کد جدید</button>

<dialog id="dlg">
  <div id="dtitle" style="font-weight:800;font-size:17px">کد جدید</div>
  <label>کد یا نام ذکر</label><input id="f-name" dir="ltr" placeholder="74623360">
  <label>خلاصه کارکرد (اختیاری)</label><textarea id="f-note" rows="2"></textarea>
  <div class="two">
    <div><label>تعداد در هر روز</label><input id="f-per" type="number" min="1" value="21"></div>
    <div><label>تعداد روز</label><input id="f-days" type="number" min="1" value="21"></div>
  </div>
  <label>تاریخ شروع</label><input id="f-start" type="date"><div class="sub" id="f-fa"></div>
  <div class="row"><button class="small" id="save" style="background:var(--acc);color:#fff">ذخیره</button><button class="small" id="cancel">انصراف</button><button class="small" id="del" style="margin-inline-start:auto;color:#c0392b">حذف</button></div>
</dialog>

<script>
const KEY='zekr-v1';
let S={items:[],rtime:'08:00',notified:''};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
let REF=null,pushing=false,dirty=false,timer=null;
const setStatus=t=>{const e=document.getElementById('sync');if(e)e.textContent=t};
const save=()=>{S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}dirty=true;clearTimeout(timer);timer=setTimeout(push,600)};
async function push(){
  if(!REF)return;
  if(pushing){timer=setTimeout(push,600);return}
  pushing=true;dirty=false;setStatus('در حال ذخیره…');
  try{await REF.set(JSON.parse(JSON.stringify(S)));setStatus('ذخیره‌شده روی حساب ✓')}
  catch(e){dirty=true;setStatus('ذخیره‌ی آنلاین انجام نشد؛ روی همین گوشی ذخیره شد')}
  pushing=false;
}
async function pull(){
  if(!REF||dirty||pushing)return;
  try{
    const s=await REF.get();
    if(s.exists){
      const r=s.data();
      if((r.ts||0)>(S.ts||0)){
        S=Object.assign({items:[],rtime:'08:00',notified:''},r);
        try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
        $('rtime').value=S.rtime;render();
      }else if((r.ts||0)<(S.ts||0)){push();return}
    }else if(S.items.length){push();return}
    setStatus('همگام با حساب ✓');
  }catch(e){setStatus('اتصال به حساب برقرار نشد')}
}
(async()=>{
  try{
    const u=await claude.use('user'),d=await claude.use('db');
    if(!u||!d){setStatus('ذخیره‌ی آنلاین فعال نیست؛ اطلاعات فقط روی همین گوشی است');return}
    const id=await u.id();
    if(!id){setStatus('برای ذخیره‌ی آنلاین وارد حساب Claude شو');return}
    REF=d.doc('data/users/'+id+'/state');
    await pull();
  }catch(e){setStatus('ذخیره‌ی آنلاین فعال نیست؛ اطلاعات فقط روی همین گوشی است')}
})();
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dayDiff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const fa=s=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'long',day:'numeric'}).format(parse(s));
const faN=n=>new Intl.NumberFormat('fa-IR').format(n);
const todayS=()=>ymd(new Date());
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

function stats(it){
  const t=todayS(), dn=dayDiff(t,it.start)+1, end=addDays(it.start,it.days-1);
  const done=Object.values(it.log).filter(v=>v>=it.per).length;
  return {t,dn,end,done,left:it.days-done,finished:done>=it.days,notStarted:dn<1,over:dn>it.days};
}

function render(){
  $('today').textContent='امروز: '+fa(todayS());
  const L=$('list');
  if(!S.items.length){L.innerHTML='<div class="empty">هنوز کدی اضافه نکرده‌ای.<br>دکمه «کد جدید» را بزن.</div>';$('banner').innerHTML='';return}
  let pending=0;
  L.innerHTML=S.items.map((it,i)=>{
    const s=stats(it), c=it.log[s.t]||0, ok=c>=it.per, active=!s.notStarted&&!s.finished;
    if(active&&!ok)pending++;
    const status=s.finished?'تمام شد ✓':s.notStarted?'هنوز شروع نشده':s.over?`مهلت گذشته (${faN(s.left)} روز مانده)`:`روز ${faN(s.dn)} از ${faN(it.days)}`;
    return `<div class="card ${ok?'done':''}">
      <div class="top"><div class="code">${esc(it.name)}</div><button class="small" data-e="${i}">ویرایش</button></div>
      ${it.note?`<div class="note">${esc(it.note)}</div>`:''}
      <div class="meta"><span>شروع: <b>${fa(it.start)}</b></span><span>پایان: <b>${fa(s.end)}</b></span>
      <span>وضعیت: <b>${status}</b></span><span>مانده: <b>${faN(s.left)} روز</b></span></div>
      <div class="bar"><i style="width:${Math.min(100,s.done/it.days*100)}%"></i></div>
      <div class="note" style="margin:0 0 6px">${faN(s.done)} روز خوانده‌شده از ${faN(it.days)}</div>
      <div class="zr"><button class="tap" data-t="${i}" ${ok?'disabled':''}>${ok?'امروز کامل شد ✓':faN(c)+' / '+faN(it.per)+' — بزن'}</button>
      <button class="small" data-u="${i}" ${c?'':'disabled'}>−۱</button></div>
      <div class="row"><label class="chk"><input type="checkbox" data-c="${i}" ${ok?'checked':''}>امروز خواندم (تیک دستی)</label></div>
    </div>`}).join('');
  $('banner').innerHTML=pending?`<div class="banner">امروز ${faN(pending)} کد هنوز مانده است.</div>`:'<div class="banner" style="background:var(--acc2)">امروز همه کدها تمام شد. 🌿</div>';
}

$('list').addEventListener('click',e=>{
  const b=e.target.closest('button,input');if(!b)return;
  const d=b.dataset,t=todayS();
  if(d.t!==undefined){const it=S.items[d.t],c=(it.log[t]||0)+1;it.log[t]=Math.min(c,it.per);buzz(c>=it.per?[90,60,90,60,250]:40);save();render()}
  else if(d.u!==undefined){const it=S.items[d.u],c=(it.log[t]||0)-1;if(c<=0)delete it.log[t];else it.log[t]=c;save();render()}
  else if(d.c!==undefined){const it=S.items[d.c];if(b.checked){it.log[t]=it.per;buzz(80)}else delete it.log[t];save();render()}
  else if(d.e!==undefined)openDlg(+d.e);
});

let editing=-1;
function openDlg(i){
  editing=i;const it=S.items[i];
  $('dtitle').textContent=it?'ویرایش کد':'کد جدید';
  $('f-name').value=it?it.name:'';$('f-note').value=it?it.note:'';
  $('f-per').value=it?it.per:21;$('f-days').value=it?it.days:21;
  $('f-start').value=it?it.start:todayS();$('del').style.display=it?'':'none';
  showFa();$('dlg').showModal();
}
function showFa(){const v=$('f-start').value;$('f-fa').textContent=v?fa(v):''}
$('f-start').addEventListener('input',showFa);
$('add').onclick=()=>openDlg(-1);
$('cancel').onclick=()=>$('dlg').close();
$('save').onclick=()=>{
  const name=$('f-name').value.trim();if(!name){$('f-name').focus();return}
  const per=Math.max(1,parseInt($('f-per').value)||1),days=Math.max(1,parseInt($('f-days').value)||1);
  const start=$('f-start').value||todayS(),note=$('f-note').value.trim();
  if(editing>=0)Object.assign(S.items[editing],{name,note,per,days,start});
  else S.items.push({id:Date.now(),name,note,per,days,start,log:{}});
  save();$('dlg').close();render();
};
$('del').onclick=()=>{if(confirm('این کد حذف شود؟')){S.items.splice(editing,1);save();$('dlg').close();render()}};

$('rtime').value=S.rtime;
$('rtime').onchange=e=>{S.rtime=e.target.value;save()};
$('rbtn').onclick=async()=>{
  if(!('Notification' in window)){alert('این مرورگر اعلان را پشتیبانی نمی‌کند.');return}
  const p=await Notification.requestPermission();
  $('rbtn').textContent=p==='granted'?'اعلان فعال است':'اعلان مجاز نشد';
};
if('Notification' in window&&Notification.permission==='granted')$('rbtn').textContent='اعلان فعال است';
setInterval(()=>{
  const n=new Date(),hm=pad(n.getHours())+':'+pad(n.getMinutes()),t=todayS();
  if(hm===S.rtime&&S.notified!==t){
    const p=S.items.filter(it=>{const s=stats(it);return !s.notStarted&&!s.finished&&(it.log[t]||0)<it.per}).length;
    if(p&&'Notification' in window&&Notification.permission==='granted'){new Notification('وقت اذکار است',{body:faN(p)+' کد هنوز مانده'});}
    S.notified=t;save();
  }
  if(document.visibilityState==='visible')render();
},30000);
document.addEventListener('visibilitychange',()=>{render();pull()});
render();
</script>
</body>
</html>
